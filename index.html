<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SIT Post App</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <nav class="navbar navbar-expand-lg navbarColor">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SIT Post App</a>
            <div class="ms-auto">
                <button class="btn btn-outline-dark" onclick="showLogin()">Login</button>
                <button class="btn btn-dark" onclick="showSignup()">Signup</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div id="signupForm" class="card p-4 mx-auto formCard">
            <h3>Sign Up</h3>
            <input type="text" id="signupName" class="form-control mb-3" placeholder="Enter your name">
            <input type="email" id="signupEmail" class="form-control mb-3" placeholder="Enter your email">
            <input type="password" id="signupPassword" class="form-control mb-3" placeholder="Enter password">
            <button class="btn postBtn" onclick="signup()">Register</button>
            <p class="mt-3">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
        </div>

        <div id="loginForm" class="card p-4 mx-auto formCard d-none">
            <h3>Login</h3>
            <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Enter your email">
            <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Enter password">
            <button class="btn postBtn" onclick="login()">Login</button>
            <p class="mt-3">Don't have an account? <a href="#" onclick="showSignup()">Signup</a></p>
        </div>

        <div id="postPage" class="d-none">

            <div class="card p-3 mb-4">
                <h3>Create Post</h3>

                <input type="text" id="title" class="form-control mb-3" placeholder="Enter your name">

                <textarea id="desc" class="form-control mb-3" rows="3" placeholder="Descriptiom"></textarea>

                <div class="d-flex gap-2 mb-3">
                    <img class="bgImg selected" onclick="selectImg('./images/1.jpg')" src="./images/1.jpg">
                    <img class="bgImg" onclick="selectImg('./images/2.jpg')" src="./images/2.jpg">
                    <img class="bgImg" onclick="selectImg('./images/3.jpg')" src="./images/3.jpg">
                    <img class="bgImg" onclick="selectImg('./images/4.png')" src="./images/4.png">
                    <img class="bgImg" onclick="selectImg('./images/5.jpg')" src="./images/5.jpg">
                </div>

                <button class="btn postBtn" id="createBtn" onclick="post()">Create Post</button>
            </div>

            <div class="row" id="postContainer"></div>

        </div>

    </div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>

    <script src="app.js"></script>
</body>
</body>
</html>
